<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Glyphs</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>:root{--bg:#0F1214;--bg-raised:#161B1E;--bg-sunken:#0A0D0E;--bg-select:#252E33;--line:#606C74;--ink:#E8E4DA;--ink-muted:#AAB3B8;--ink-faint:#8A949B;--ink-ghost:#3F494F;--saffron:#F2A541;--saffron-fill:#F2A541;--on-saffron:#1A1206;--ok:#43D19E;--fail:#FF7A5C;--fault:#EE93D9;--skill:#74C9F6;--gate:#F6DC5C;--gate-fill:#F6DC5C;--on-gate:#15130A;--font-mono:"JetBrains Mono",ui-monospace,monospace}@media (prefers-color-scheme: light){:root{--bg:#F7F5F0;--bg-raised:#EEEBE3;--bg-sunken:#E7E3D9;--bg-select:#E3DED3;--line:#858279;--ink:#16181A;--ink-muted:#474E53;--ink-faint:#5A6166;--ink-ghost:#C4C0B6;--saffron:#8F5300;--saffron-fill:#F0A03A;--on-saffron:#1A1206;--ok:#00704F;--fail:#B0341A;--fault:#8E327B;--skill:#085F88;--gate:#6E5600;--gate-fill:#F2D13A;--on-gate:#16181A}}</style><style>
html,body{margin:0;background:var(--bg-raised);}
body{padding:16px;font-family:var(--font-mono);color:var(--ink);}
.cap{font:600 12px/16px var(--font-mono);color:var(--ink-muted);margin:0 0 6px;letter-spacing:.02em}
.cap b{color:var(--ink)}
.term{display:inline-block;background:var(--bg);color:var(--ink);padding:10px 12px;border-radius:10px;outline:1px solid var(--line);margin-bottom:20px}
.r{white-space:pre;font:400 14px/17px var(--font-mono);height:17px;overflow:hidden;font-variant-ligatures:none}
.b{font-weight:700}.u{text-decoration:underline;text-underline-offset:3px}
.w2{display:inline-block;width:2ch;text-align:left;overflow:hidden;vertical-align:top}
.w1{display:inline-block;width:1ch;height:17px;text-align:center;overflow:visible;vertical-align:top}
.f-bg{color:var(--bg)}
.f-bg-raised{color:var(--bg-raised)}
.f-bg-sunken{color:var(--bg-sunken)}
.f-bg-select{color:var(--bg-select)}
.f-line{color:var(--line)}
.f-ink{color:var(--ink)}
.f-ink-muted{color:var(--ink-muted)}
.f-ink-faint{color:var(--ink-faint)}
.f-ink-ghost{color:var(--ink-ghost)}
.f-saffron{color:var(--saffron)}
.f-saffron-fill{color:var(--saffron-fill)}
.f-on-saffron{color:var(--on-saffron)}
.f-ok{color:var(--ok)}
.f-fail{color:var(--fail)}
.f-fault{color:var(--fault)}
.f-skill{color:var(--skill)}
.f-gate{color:var(--gate)}
.f-gate-fill{color:var(--gate-fill)}
.f-on-gate{color:var(--on-gate)}
.k-bg{background:var(--bg)}
.k-bg-raised{background:var(--bg-raised)}
.k-bg-sunken{background:var(--bg-sunken)}
.k-bg-select{background:var(--bg-select)}
.k-line{background:var(--line)}
.k-ink{background:var(--ink)}
.k-ink-muted{background:var(--ink-muted)}
.k-ink-faint{background:var(--ink-faint)}
.k-ink-ghost{background:var(--ink-ghost)}
.k-saffron{background:var(--saffron)}
.k-saffron-fill{background:var(--saffron-fill)}
.k-on-saffron{background:var(--on-saffron)}
.k-ok{background:var(--ok)}
.k-fail{background:var(--fail)}
.k-fault{background:var(--fault)}
.k-skill{background:var(--skill)}
.k-gate{background:var(--gate)}
.k-gate-fill{background:var(--gate-fill)}
.k-on-gate{background:var(--on-gate)}</style></head>
<body>
<div class="cap"><b>Symbols and the words they travel with</b></div><div class="term" data-anims="[]"><div class="r"><span class="f-ink">                                                                                                        </span></div>
<div class="r"><span class="f-ink">  </span><span class="f-ok b w1">✓</span><span class="f-ink">   done </span><span class="f-ink w1">·</span><span class="f-ink"> passed </span><span class="f-ink w1">·</span><span class="f-ink"> recovered     </span><span class="f-fail b w1">✗</span><span class="f-ink">   failed </span><span class="f-ink w1">·</span><span class="f-ink"> not now </span><span class="f-ink w1">·</span><span class="f-ink"> retired    </span><span class="f-saffron b w1">⠹</span><span class="f-ink">   working (spins)               </span></div>
<div class="r"><span class="f-ink">                                                                                                        </span></div>
<div class="r"><span class="f-ink">  </span><span class="f-ink-faint b w1">○</span><span class="f-ink">   not started                   </span><span class="f-gate b w1">◆</span><span class="f-ink">   needs your ok (only here)     </span><span class="f-fault b w2">⚡</span><span class="f-ink">  chaos threw a fault           </span></div>
<div class="r"><span class="f-ink">                                                                                                        </span></div>
<div class="r"><span class="f-ink">  </span><span class="f-skill b w1">↳</span><span class="f-ink">   used a learned skill          </span><span class="f-saffron b w1">✦</span><span class="f-ink">   new skill                     </span><span class="f-saffron b w1">•</span><span class="f-ink">   monk is talking               </span></div>
<div class="r"><span class="f-ink">                                                                                                        </span></div>
<div class="r"><span class="f-ink">  </span><span class="f-saffron b w1">›</span><span class="f-ink">   you / prompt / selected       </span><span class="f-bg k-ink b w1">▣</span><span class="f-ink">   sandbox </span><span class="f-ink w1">·</span><span class="f-ink"> phone               </span><span class="f-saffron b">▌ █</span><span class="f-ink"> streaming </span><span class="f-ink w1">·</span><span class="f-ink"> caret             </span></div></div>
<script>
(function(){
  var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  function esc(c){return c=='&'?'&amp;':c=='<'?'&lt;':c=='>'?'&gt;':c;}
  function rt(t){var s='';for(var i=0;i<t.length;i++){var c=t[i],k=c.charCodeAt(0);
    s+=(k>127&&!(k>=0x2500&&k<=0x259F))?'<span class="w1">'+esc(c)+'</span>':esc(c);}return s;}
  document.querySelectorAll('.term').forEach(function(term){
    var A = JSON.parse(term.getAttribute('data-anims')||'[]');
    var els = term.querySelectorAll('.a');
    var last = [];
    function tick(){
      var t = performance.now();
      els.forEach(function(el){
        var i = +el.getAttribute('data-a'), a = A[i]; if(!a) return;
        var n = a.f.length, k = Math.floor((t + a.o) / a.ms) % n;
        if (last[i] === k) return; last[i] = k;
        var f = a.f[k];
        el.className = 'a f-' + f[1] + (f[2] ? ' b' : '') + (a.bg ? ' k-' + a.bg : '');
        el.innerHTML = rt(f[0]);
      });
    }
    if (!reduce) setInterval(tick, 40);
  });
})();
</script>
</body></html>
