# Overrides for running a Monk-only AgentEye from the agenteye repo's main worktree
# (~/Desktop/agenteye-main, which has hosted LLM judges + JEV) without touching it or its data:
# its own compose project (fresh volumes), and mailpit moved off 8026, which another local stack uses.
services:
  managed-evaluator:
    environment:
      # Main's compose passes the JEV account, token and gateway but not the base URL.
      FAILPROOFAI_EVALUATOR_JEV_BASE_URL: ${FAILPROOFAI_EVALUATOR_JEV_BASE_URL:-https://api.cloudflare.com/client/v4}
  mailpit:
    ports: !override
      - "8027:8025"
